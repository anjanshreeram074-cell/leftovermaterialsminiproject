# BuildBack — Fly.io Configuration
# Run: fly launch (auto-detects Dockerfile) → fly deploy

app = "buildback"
primary_region = "iad"  # Change to nearest region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Environment variables (set via: fly secrets set KEY=VALUE)
# [env]
# DATABASE_URL = "mysql://user:pass@host:3306/buildback"
# SECRET_KEY = "..."
# GOOGLE_MAPS_API_KEY = "..."
# CLOUDINARY_CLOUD_NAME = "..."
# CLOUDINARY_API_KEY = "..."
# CLOUDINARY_API_SECRET = "..."

# Optional: MySQL on Fly (separate app)
# fly postgres create --name buildback-db
# fly postgres attach --app buildback buildback-db