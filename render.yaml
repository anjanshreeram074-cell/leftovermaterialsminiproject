# BuildBack — Render Blueprint
# Connect repo → "New Blueprint Instance" → auto-creates web service + database

services:
  # Web Service
  - type: web
    name: buildback
    runtime: python3
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn buildback.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 60"
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buildback-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "buildback.onrender.com"
      - key: GOOGLE_MAPS_API_KEY
        sync: false  # Set manually in dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
    # Auto-deploy on push to main
    autoDeploy: true

  # Database (PostgreSQL on Render, but you can use external MySQL)
  - type: pserv
    name: buildback-db
    plan: free
    # Note: Render uses PostgreSQL. For MySQL, use external (Railway MySQL, PlanetScale, etc.)
    # and set DATABASE_URL manually in web service env vars.

databases:
  - name: buildback-db
    databaseName: buildback
    user: buildback
    plan: free